name: Build vendor tree from vendor.tar.gz

on:
  workflow_dispatch:
    inputs:
      vendor_tar:
        description: "Nama file vendor.tar.gz di root repo"
        required: true
        default: "vendor.tar.gz"
      out_dir:
        description: "Folder tujuan device (samsung/a02)"
        required: true
        default: "vendor/samsung/a02"
      arch_filter:
        description: "Filter arsitektur: 32 (skip lib64/bin64) atau all"
        required: true
        default: "32"
      commit_message:
        description: "Commit message"
        required: true
        default: "vendor: regenerate a02 proprietary blobs + makefiles"

jobs:
  build-vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Debug - git lfs status
        run: |
          echo "== git lfs version =="
          git lfs version || echo "git-lfs BINARY GAK KETEMU DI RUNNER"

          echo "== git lfs env =="
          git lfs env || true

          echo "== file terdaftar sbg LFS di repo ini =="
          git lfs ls-files || true

          echo "== .gitattributes =="
          cat .gitattributes 2>/dev/null || echo "(gak ada .gitattributes -> vendor.tar.gz KEMUNGKINAN BESAR GAK KETRACK SEBAGAI LFS)"

      - name: Force git lfs pull
        run: |
          git lfs install --local
          git lfs pull
          echo "== hasil setelah lfs pull =="
          ls -la "${{ github.event.inputs.vendor_tar }}"
          file "${{ github.event.inputs.vendor_tar }}"

      - name: Cek vendor.tar.gz beneran udah binary (bukan pointer)
        run: |
          FSIZE=$(stat -c%s "${{ github.event.inputs.vendor_tar }}")
          echo "Ukuran file: $FSIZE bytes"
          if head -c 200 "${{ github.event.inputs.vendor_tar }}" | grep -q "git-lfs.github.com"; then
            echo "=========================================================="
            echo "MASIH POINTER LFS, BUKAN FILE ASLI. Kemungkinan penyebab:"
            echo "1) vendor.tar.gz gak ketrack .gitattributes filter=lfs pas awal commit"
            echo "   -> berarti pointer-nya ke-commit sebagai TEKS BIASA (bukan lewat LFS filter),"
            echo "      jadi 'git lfs pull' gak akan bisa narik apa-apa karena LFS server gak"
            echo "      punya object itu (bukan bug workflow, bug cara commit awal)."
            echo "2) LFS quota/storage repo abis atau butuh auth khusus."
            echo "=========================================================="
            cat "${{ github.event.inputs.vendor_tar }}"
            exit 1
          fi

      - name: Cek vendor.tar.gz ada
        run: |
          if [ ! -f "${{ github.event.inputs.vendor_tar }}" ]; then
            echo "File ${{ github.event.inputs.vendor_tar }} gak ketemu di root repo."
            exit 1
          fi

      - name: Extract vendor.tar.gz
        run: |
          rm -rf _vendor_extract
          mkdir -p _vendor_extract
          tar -xzf "${{ github.event.inputs.vendor_tar }}" -C _vendor_extract
          echo "== isi vendor.tar.gz =="
          find _vendor_extract -maxdepth 3 | sort | head -100

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate proprietary tree + makefiles
        run: |
          python3 .github/scripts/gen_vendor_tree.py \
            --src _vendor_extract \
            --out "${{ github.event.inputs.out_dir }}" \
            --arch-filter "${{ github.event.inputs.arch_filter }}"

      - name: Cek hasil
        run: |
          echo "== proprietary-files.txt (head) =="
          head -50 "${{ github.event.inputs.out_dir }}/proprietary-files.txt" || true
          echo "== jumlah blob =="
          find "${{ github.event.inputs.out_dir }}/proprietary" -type f | wc -l

      - name: Cleanup tmp
        run: rm -rf _vendor_extract

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Gak ada perubahan buat di-commit."
            exit 0
          fi
          git commit -m "${{ github.event.inputs.commit_message }}"
          git push
