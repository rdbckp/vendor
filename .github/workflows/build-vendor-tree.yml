name: Build vendor.img (manual)

# Trigger manual dari tab Actions di GitHub, gak butuh terminal/codespace.
#
# UPDATE dari hasil deteksi disk (detect-disk-space.yml):
# runner ubuntu-24.04 sekarang punya partisi root 145G, dengan ~119G
# free SESUDAH cleanup tool preinstalled. /tmp, /home/runner, dan /
# semua di partisi yang sama (bukan mount terpisah) — /mnt & /var
# read-only, jangan dipakai.
# ~119GB masih PAS-PASAN buat LineageOS 20 (source ~100GB + build
# artifact bisa +50-100GB lagi) — build target dipersempit ke
# "vendorimage" (bukan "bacon") biar output lebih kecil, dan cleanup
# disk dijalanin duluan buat maksimalin ruang. Tetep ada kemungkinan
# gagal kehabisan disk pas linking/packaging tahap akhir — kalau itu
# kejadian, satu-satunya jalan keluar tetep self-hosted runner atau
# GitHub Larger Runners (disk lebih gede dari 145G).

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: "Branch manifest LineageOS"
        required: true
        default: "lineage-20.0"
      device:
        description: "Nama device (folder di device/samsung/<device>)"
        required: true
        default: "a02"
      lunch_target:
        description: "Lunch combo (device_variant)"
        required: true
        default: "lineage_a02-userdebug"
      build_target:
        description: "Target make: vendorimage (cuma vendor.img) atau bacon (full ROM zip)"
        required: true
        default: "vendorimage"
      local_manifest_url:
        description: "Raw URL ke local_manifests xml kamu (device tree + kernel repo)"
        required: true
        default: "https://raw.githubusercontent.com/rdbckp/vendor/main/.repo/local_manifests/a02.xml"

jobs:
  build-vendor-image:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # GH Actions free tier max 6 jam (360 menit) per job

    steps:
      - name: Bebasin disk sebanyak mungkin
        run: |
          echo "== Disk sebelum cleanup =="
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" /usr/local/.ghcup \
            /usr/share/swift /opt/az /usr/lib/jvm || true
          sudo docker image prune --all --force || true
          sudo apt-get clean
          echo "== Disk sesudah cleanup =="
          df -h

      - name: Install dependency build Android
        run: |
          # lib32ncurses5-dev udah gak ada di Ubuntu 24.04 (noble) — diganti lib32ncurses-dev.
          # Paket i386/32-bit multilib butuh arsitektur i386 diaktifin dulu.
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig python3 python-is-python3

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Setup git identity (dibutuhin repo tool)
        run: |
          git config --global user.name "gh-actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false

      - name: repo init manifest LineageOS
        run: |
          mkdir -p ~/lineage20 && cd ~/lineage20
          repo init --depth=1 -u https://github.com/LineageOS/android.git \
            -b ${{ github.event.inputs.manifest_branch }} --git-lfs

      - name: Pasang local manifest (device tree + kernel + vendor)
        run: |
          cd ~/lineage20
          mkdir -p .repo/local_manifests
          curl -L -o .repo/local_manifests/local.xml \
            "${{ github.event.inputs.local_manifest_url }}"
          cat .repo/local_manifests/local.xml

      - name: repo sync (source penuh — paling makan disk & waktu)
        run: |
          cd ~/lineage20
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags --optimized-fetch
          df -h

      - name: Build vendor image
        run: |
          cd ~/lineage20
          source build/envsetup.sh
          lunch ${{ github.event.inputs.lunch_target }}
          make ${{ github.event.inputs.build_target }} -j$(nproc)

      - name: Cari hasil build
        run: |
          cd ~/lineage20
          find out/target/product/${{ github.event.inputs.device }} -maxdepth 1 \
            -iname "vendor.img" -o -iname "*.zip" | tee /tmp/found_files.txt

      - name: Upload hasil sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendor-build-${{ github.event.inputs.device }}
          path: |
            /home/runner/lineage20/out/target/product/${{ github.event.inputs.device }}/vendor.img
            /home/runner/lineage20/out/target/product/${{ github.event.inputs.device }}/*.zip
          if-no-files-found: warn
          retention-days: 7
