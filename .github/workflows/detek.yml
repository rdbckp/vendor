name: Detect disk space (manual)

# Diagnostik doang — buat lihat mount point mana di runner yang paling
# gede kapasitasnya, biar tau lokasi terbaik buat clone source Android
# (misal /tmp yang katanya bisa sampe ~109GB di sebagian runner GH free tier).

on:
  workflow_dispatch:

jobs:
  detect-disk:
    runs-on: ubuntu-latest

    steps:
      - name: Info runner (OS, arch, spec)
        run: |
          echo "== uname =="
          uname -a
          echo
          echo "== nproc & meminfo =="
          nproc
          free -h

      - name: Semua mount point + kapasitas (sebelum cleanup)
        run: |
          echo "== df -h (semua filesystem) =="
          df -h
          echo
          echo "== df -h (urut dari yang paling banyak free space) =="
          df -h --output=target,avail,size,pcent,fstype | tail -n +2 | sort -k2 -h -r

      - name: Cek spesifik /tmp, /mnt, /home/runner, /
        run: |
          for dir in /tmp /mnt /home/runner / /var; do
            if [ -d "$dir" ]; then
              echo "== $dir =="
              df -h "$dir"
              echo "Writable test:"
              touch "$dir/._write_test" 2>&1 && echo "OK bisa nulis" && rm -f "$dir/._write_test" || echo "GAGAL nulis / read-only"
              echo
            fi
          done

      - name: Cek lsblk (raw block device, kadang ada partisi belum ke-mount)
        run: |
          lsblk -o NAME,SIZE,TYPE,MOUNTPOINT,FSTYPE || true
          echo
          sudo fdisk -l 2>/dev/null || true

      - name: Bebasin disk (uninstall tool preinstalled yang jarang kepake)
        run: |
          echo "== Disk sebelum cleanup =="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" /usr/local/.ghcup \
            /usr/share/swift /opt/az /usr/lib/jvm || true
          sudo docker image prune --all --force || true
          sudo apt-get clean
          echo "== Disk sesudah cleanup =="
          df -h /

      - name: Kesimpulan — mount point terbesar buat dipake
        run: |
          echo "Pakai mount point dengan 'Avail' terbesar dari step df di atas."
          echo "Kalau /tmp atau /mnt ternyata paling gede, di workflow build nanti"
          echo "clone/sync source Android ke situ, misal:"
          echo "  mkdir -p /mnt/lineage20 && cd /mnt/lineage20"
          echo "bukan ke \$HOME (yang biasanya nempel di partisi root /, lebih kecil)."
