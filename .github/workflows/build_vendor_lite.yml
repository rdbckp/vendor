name: Build vendor.img - LITE (manual)

# Versi hemat disk & waktu dari build-vendor-image.yml.
# Bedanya:
#   1. repo init pakai --partial-clone --clone-filter=blob:limit=10M
#      -> git cuma download blob besar pas bener-bener dibutuhin
#         build (lazy fetch), bukan semua sekaligus. Biasanya motong
#         30-50% ukuran checkout dibanding sync penuh.
#   2. Build target default tetep "vendorimage" (paling kecil).
#   3. Env var WITHOUT_CHECK_API + hemat ninja args biar build juga
#      lebih cepet & gak buang waktu di API compatibility check yang
#      gak relevan buat vendor image doang.
#   4. ccache DIMATIKAN (bukan diaktifin) karena ccache butuh disk
#      ekstra buat cache-nya sendiri — di runner sekali-pakai kayak
#      gini gak ada gunanya (cache ilang begitu job selesai) dan
#      cuma makan jatah disk yang udah pas-pasan.
#
# CATATAN: source AOSP/LineageOS tetep harus sync penuh strukturnya
# (frameworks/, build/, system/, dst) karena Soong/Make butuh compile
# host tools dari situ walau target akhirnya cuma vendorimage. Partial
# clone motong UKURAN blob-nya, bukan JUMLAH project yang disync.

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: "Branch manifest LineageOS"
        required: true
        default: "lineage-20.0"
      device:
        description: "Nama device (folder di device/samsung/<device>)"
        required: true
        default: "a02"
      lunch_target:
        description: "Lunch combo (device_variant)"
        required: true
        default: "lineage_a02-userdebug"
      build_target:
        description: "Target make: vendorimage (paling kecil) / bootimage / systemimage / bacon"
        required: true
        default: "vendorimage"
      local_manifest_url:
        description: "Raw URL ke local_manifests xml kamu (device tree + kernel repo)"
        required: true
        default: "https://raw.githubusercontent.com/rdbckp/vendor/main/.repo/local_manifests/a02.xml"
      blob_filter_size:
        description: "Partial clone: skip blob lebih gede dari ini kecuali dibutuhin (contoh: 10M, 20M)"
        required: true
        default: "10M"

jobs:
  build-vendor-image-lite:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # GH Actions free tier max 6 jam (360 menit) per job

    steps:
      - name: Bebasin disk sebanyak mungkin
        run: |
          echo "== Disk sebelum cleanup =="
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" /usr/local/.ghcup \
            /usr/share/swift /opt/az /usr/lib/jvm || true
          sudo docker image prune --all --force || true
          sudo apt-get clean
          echo "== Disk sesudah cleanup =="
          df -h

      - name: Install dependency build Android
        run: |
          # lib32ncurses5-dev udah gak ada di Ubuntu 24.04 (noble) — diganti lib32ncurses-dev.
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig python3 python-is-python3

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Setup git identity (dibutuhin repo tool)
        run: |
          git config --global user.name "gh-actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false

      - name: repo init manifest LineageOS (partial clone)
        run: |
          mkdir -p ~/lineage20 && cd ~/lineage20
          repo init --depth=1 \
            --partial-clone --clone-filter=blob:limit=${{ github.event.inputs.blob_filter_size }} \
            -u https://github.com/LineageOS/android.git \
            -b ${{ github.event.inputs.manifest_branch }} --git-lfs

      - name: Pasang local manifest (device tree + kernel + vendor)
        run: |
          cd ~/lineage20
          mkdir -p .repo/local_manifests
          curl -L -o .repo/local_manifests/local.xml \
            "${{ github.event.inputs.local_manifest_url }}"
          cat .repo/local_manifests/local.xml

      - name: repo sync (partial clone — lebih hemat disk & waktu)
        run: |
          cd ~/lineage20
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags --optimized-fetch
          df -h

      - name: Ubah symlink device/vendor jadi folder asli (AOSP find gak nembus symlink)
        run: |
          cd ~/lineage20
          # Local manifest yang pakai <linkfile> bikin device/samsung/<device> dan
          # vendor/samsung/<device> jadi symlink. Bash glob (vendorsetup.sh) nembus
          # symlink, tapi `find` yang dipakai build system buat nyari AndroidProducts.mk
          # TIDAK nembus symlink secara default -> product config gagal ketemu.
          # Fix: ganti symlink jadi copy folder asli.
          for link in device/samsung/${{ github.event.inputs.device }} vendor/samsung/${{ github.event.inputs.device }}; do
            if [ -L "$link" ]; then
              target=$(readlink -f "$link")
              echo "Convert symlink: $link -> $target"
              rm "$link"
              cp -a "$target" "$link"
            else
              echo "$link bukan symlink, skip"
            fi
          done

      - name: Build vendor image (mode lite)
        env:
          WITHOUT_CHECK_API: "true"
          USE_CCACHE: "0"
        run: |
          cd ~/lineage20
          source build/envsetup.sh
          lunch ${{ github.event.inputs.lunch_target }}
          make ${{ github.event.inputs.build_target }} -j$(nproc)

      - name: Bersihin intermediate build biar artifact upload gak ke-skip karena disk penuh
        run: |
          cd ~/lineage20
          # buang objek intermediate yang gak perlu ikut ke-upload
          find out/target/product/${{ github.event.inputs.device }}/obj -mindepth 1 -maxdepth 1 -type d ! -name "PACKAGING" -exec rm -rf {} + 2>/dev/null || true
          df -h

      - name: Cari hasil build
        run: |
          cd ~/lineage20
          find out/target/product/${{ github.event.inputs.device }} -maxdepth 1 \
            -iname "vendor.img" -o -iname "*.zip" | tee /tmp/found_files.txt

      - name: Upload hasil sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendor-build-lite-${{ github.event.inputs.device }}
          path: |
            /home/runner/lineage20/out/target/product/${{ github.event.inputs.device }}/vendor.img
            /home/runner/lineage20/out/target/product/${{ github.event.inputs.device }}/*.zip
          if-no-files-found: warn
          retention-days: 7
